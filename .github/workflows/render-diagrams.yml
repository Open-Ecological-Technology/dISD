name: Generate PlantUML
on:
  push:
    paths:
      - '**.puml' # Triggers on any .puml file in any folder, including root
jobs:
  render:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Crucial: gives the action permission to push the SVG back
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate SVG
        uses: grassedge/generate-plantuml-action@v1.5
        with:
          path: . # Changing this to "." makes it scan the root
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
